<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EC">
  <title>箭头小憩 · 二十个轻松小关卡</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <main class="layout">
    <aside class="intro" aria-label="游戏介绍">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> 一点闲暇，一点清晰</div>
      <h1>给思绪<br>留一条通路。</h1>
      <p>观察箭头的方向，<br>一支一支，慢慢解开。</p>
      <div class="intro-note">20 个关卡<br>没有倒计时，也不用赶路。</div>
      <div class="local-note">无需登录 · 无广告<br>进度保存在当前设备</div>
    </aside>
    <section class="game-shell" aria-label="箭头小憩游戏">
      <p id="loading" class="loading" role="status">正在打开小憩，请稍候…</p>
      <canvas id="game" width="390" height="844" aria-label="箭头消除游戏棋盘">请使用支持 Canvas 的浏览器打开游戏。</canvas>
      <div id="controls" class="controls" aria-label="游戏操作"></div>
      <section id="storage-error" class="error-panel" hidden role="alert">
        <h2>原有进度暂时无法读取</h2>
        <p>为了保留你的记录，我们没有覆盖它。你可以重新打开，或先备份再清除本机进度。</p>
        <button id="retry-storage" type="button">重新读取</button>
        <button id="reset-storage" type="button" class="secondary">备份并重新开始</button>
        <p id="error-detail"></p>
      </section>
    </section>
  </main>
  <p id="status" class="sr-only" aria-live="polite"></p>
  <noscript>需要启用 JavaScript 才能游玩。</noscript>
</body>
</html>
